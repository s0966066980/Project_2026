name: Commercial Foundation CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: commercial-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: UI_API
    env:
      APP_ENV: test
      DATABASE_URL: ""
      SECURITY_ENFORCED: "false"
      ENABLE_DEMO_ROUTES: "false"
      ENABLE_DIAGNOSTIC_ROUTES: "false"
      ENABLE_DEBUG_ROUTES: "false"
      ENABLE_NGROK: "false"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: UI_API/requirements-ci.txt

      - name: Install CPU-only CI dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Ruff lint
        if: matrix.python-version == '3.10'
        run: >-
          ruff check
          main.py
          backend/app_factory.py
          backend/api
          backend/core
          backend/models
          backend/repositories/postgres_utils.py
          backend/repositories/admin_identity_repository.py
          backend/repositories/device_identity_repository.py
          backend/repositories/availability_repository.py
          backend/repositories/commercial_settings_repository.py
          backend/repositories/checkout_order_repository.py
          backend/repositories/interaction_event_repository.py
          backend/repositories/member_repository.py
          backend/repositories/member_session_repository.py
          backend/repositories/promotion_repository.py
          backend/repositories/rag_asset_scope_repository.py
          backend/repositories/redis_shared_adapter.py
          backend/repositories/worker_job_repository.py
          backend/routes/admin_identity_routes.py
          backend/routes/device_identity_routes.py
          backend/routes/availability_routes.py
          backend/routes/ai_push_routes.py
          backend/routes/core_routes.py
          backend/routes/interaction_routes.py
          backend/routes/menu_routes.py
          backend/routes/member_routes.py
          backend/routes/recommendation_event_routes.py
          backend/routes/realtime_routes.py
          backend/routes/voice_routes.py
          backend/routes/v1_routes.py
          backend/scripts/manage_admin_identity.py
          backend/scripts/manage_postgres_migrations.py
          backend/scripts/validate_commercial_scope.py
          backend/scripts/verify_member_identity_migration.py
          backend/services/admin_access_service.py
          backend/services/admin_authorization_service.py
          backend/services/admin_identity_service.py
          backend/services/device_identity_service.py
          backend/services/commercial_context_service.py
          backend/services/admin_audit_service.py
          backend/services/availability_service.py
          backend/services/checkout_pricing_service.py
          backend/services/checkout_service.py
          backend/services/intervention_pipeline_service.py
          backend/services/health_service.py
          backend/services/member_key_provider.py
          backend/services/member_pii_service.py
          backend/services/member_service.py
          backend/services/observability_service.py
          backend/services/promotion_banner_service.py
          backend/services/promotion_service.py
          backend/services/rag_offer_service.py
          backend/services/recommendation_context_service.py
          backend/services/recommendation_event_service.py
          backend/services/shared_infrastructure_service.py
          backend/services/worker_service.py
          backend/services/recommendation_feedback_service.py
          backend/services/ai_push_service.py
          backend/services/voice_service.py
          backend/utils

      - name: Ruff format check
        if: matrix.python-version == '3.10'
        run: >-
          ruff format --check
          main.py
          backend/app_factory.py
          backend/api
          backend/core
          backend/models
          backend/repositories/postgres_utils.py
          backend/repositories/admin_identity_repository.py
          backend/repositories/device_identity_repository.py
          backend/repositories/availability_repository.py
          backend/repositories/commercial_settings_repository.py
          backend/repositories/checkout_order_repository.py
          backend/repositories/interaction_event_repository.py
          backend/repositories/promotion_repository.py
          backend/repositories/rag_asset_scope_repository.py
          backend/repositories/redis_shared_adapter.py
          backend/repositories/worker_job_repository.py
          backend/routes/admin_identity_routes.py
          backend/routes/device_identity_routes.py
          backend/routes/availability_routes.py
          backend/routes/interaction_routes.py
          backend/routes/member_routes.py
          backend/routes/recommendation_event_routes.py
          backend/routes/realtime_routes.py
          backend/routes/v1_routes.py
          backend/scripts/manage_admin_identity.py
          backend/scripts/manage_postgres_migrations.py
          backend/scripts/validate_commercial_scope.py
          backend/scripts/verify_member_identity_migration.py
          backend/services/admin_access_service.py
          backend/services/admin_authorization_service.py
          backend/services/admin_identity_service.py
          backend/services/device_identity_service.py
          backend/services/member_key_provider.py
          backend/services/member_pii_service.py
          backend/services/health_service.py
          backend/services/observability_service.py
          backend/services/shared_infrastructure_service.py
          backend/services/worker_service.py
          backend/services/commercial_context_service.py
          backend/utils

      - name: Mypy gradual type check
        if: matrix.python-version == '3.10'
        run: mypy

      - name: Import application without lifespan or model startup
        run: python -c "from main import app; assert app.title == 'Smart Ordering Kiosk API'"

      - name: Pytest
        run: pytest -q tests

  postgres-migration:
    name: PostgreSQL migration integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: migration_ci
          POSTGRES_DB: migration_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migration_ci -d migration_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: UI_API
    env:
      APP_ENV: test
      # MEMBER_STORAGE_BACKEND is a rejected legacy selection key: setting it makes
      # load_profile() raise PersistenceConfigurationError. DATABASE_URL selects PostgreSQL.
      DATABASE_URL: postgresql://migration_ci@127.0.0.1:5432/migration_ci
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: UI_API/requirements-ci.txt

      - name: Install PostgreSQL integration dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Inspect pending migrations
        run: python backend/scripts/manage_postgres_migrations.py status

      - name: Validate migration sources
        run: python backend/scripts/manage_postgres_migrations.py validate

      - name: Apply migrations and verify idempotency
        run: pytest -q tests/postgres_migration_integration.py

      - name: Verify Milestone 1A to commercial scope upgrade
        run: pytest -q tests/postgres_commercial_scope_integration.py

      - name: Verify Admin identity and RBAC foundation
        run: pytest -q tests/postgres_identity_integration.py

      - name: Verify per-device identity foundation
        run: pytest -q tests/postgres_device_identity_integration.py

      - name: Verify commercial scope contract enforcement
        run: pytest -q tests/postgres_scope_contract_integration.py

      - name: Verify Member UUID and PII migration
        run: pytest -q tests/postgres_member_identity_integration.py

      - name: Verify Order checkout transaction boundary
        run: pytest -q tests/postgres_order_checkout_integration.py

      - name: Verify kiosk ordering cart store
        run: pytest -q tests/postgres_cart_store_integration.py

      - name: Verify commercial readiness and observability
        run: pytest -q tests/postgres_observability_integration.py

      - name: Verify reliable worker jobs and outbox delivery
        run: pytest -q tests/postgres_worker_jobs_integration.py

      - name: Verify worker production path handler and outbox ACK
        run: pytest -q tests/postgres_worker_production_path_integration.py

      - name: Reapply migrations safely
        run: python backend/scripts/manage_postgres_migrations.py apply

      - name: Validate commercial scope integrity
        run: python backend/scripts/validate_commercial_scope.py --require-complete

      - name: Backfill and validate Member identity integrity
        run: python backend/scripts/verify_member_identity_migration.py --backfill --require-clean

      - name: Validate clean migration state
        run: python backend/scripts/manage_postgres_migrations.py validate --require-clean

  frontend:
    name: Frontend type and syntax checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHON_BIN: python
    defaults:
      run:
        working-directory: UI_API/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: UI_API/frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend smoke backend dependencies
        working-directory: UI_API
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Install frontend toolchain
        run: npm ci --ignore-scripts

      - name: Type check
        run: npm run typecheck

      - name: Build independent frontend entries
        run: npm run build

      - name: Frontend unit tests
        run: npm run test:coverage

      - name: JavaScript syntax
        run: npm run syntax

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Critical Kiosk and Admin smoke tests
        run: npm run test:e2e

  redis-integration:
    name: Redis shared infrastructure integration
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      redis:
        image: redis:8.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: UI_API
    env:
      APP_ENV: test
      MEMBER_STORAGE_BACKEND: json
      DATABASE_URL: ""
      REDIS_URL: redis://127.0.0.1:6379/15
      SHARED_RATE_LIMIT_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: UI_API/requirements-ci.txt
      - name: Install CPU-only dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Verify shared cache, rate limit, scope, TTL and lock
        run: pytest -q tests/redis_shared_integration.py

  shell:
    name: Shell syntax checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate launch scripts
        run: |
          bash -n docker/scripts/setup.sh
          sh -n docker/scripts/test.sh
          sh -n docker/scripts/test-ai.sh
