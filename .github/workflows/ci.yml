name: Commercial Foundation CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: commercial-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: UI_API
    env:
      APP_ENV: test
      MEMBER_STORAGE_BACKEND: json
      DATABASE_URL: ""
      SECURITY_ENFORCED: "false"
      ENABLE_DEMO_ROUTES: "false"
      ENABLE_TEST_ROUTES: "false"
      ENABLE_DEBUG_ROUTES: "false"
      ENABLE_NGROK: "false"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: UI_API/requirements-ci.txt

      - name: Install CPU-only CI dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Ruff lint
        if: matrix.python-version == '3.10'
        run: >-
          ruff check
          main.py
          backend/api
          backend/core
          backend/models
          backend/repositories/postgres_utils.py
          backend/scripts/manage_postgres_migrations.py
          backend/utils

      - name: Ruff format check
        if: matrix.python-version == '3.10'
        run: >-
          ruff format --check
          main.py
          backend/api
          backend/core
          backend/models
          backend/repositories/postgres_utils.py
          backend/scripts/manage_postgres_migrations.py
          backend/utils

      - name: Mypy gradual type check
        if: matrix.python-version == '3.10'
        run: mypy

      - name: Import application without lifespan or model startup
        run: python -c "from main import app; assert app.title == 'Smart Ordering Kiosk API'"

      - name: Pytest
        run: pytest -q tests

  postgres-migration:
    name: PostgreSQL migration integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: migration_ci
          POSTGRES_DB: migration_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migration_ci -d migration_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: UI_API
    env:
      APP_ENV: test
      MEMBER_STORAGE_BACKEND: postgres
      DATABASE_URL: postgresql://migration_ci@127.0.0.1:5432/migration_ci
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: UI_API/requirements-ci.txt

      - name: Install PostgreSQL integration dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Inspect pending migrations
        run: python backend/scripts/manage_postgres_migrations.py status

      - name: Validate migration sources
        run: python backend/scripts/manage_postgres_migrations.py validate

      - name: Apply migrations and verify idempotency
        run: pytest -q tests/postgres_migration_integration.py

      - name: Verify Milestone 1A to commercial scope upgrade
        run: pytest -q tests/postgres_commercial_scope_integration.py

      - name: Reapply migrations safely
        run: python backend/scripts/manage_postgres_migrations.py apply

      - name: Validate clean migration state
        run: python backend/scripts/manage_postgres_migrations.py validate --require-clean

  frontend:
    name: Frontend type and syntax checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: UI_API/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: UI_API/frontend/package-lock.json

      - name: Install frontend toolchain
        run: npm ci --ignore-scripts

      - name: Type check
        run: npm run typecheck

      - name: JavaScript syntax
        run: npm run syntax

  shell:
    name: Shell syntax checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate launch scripts
        run: |
          bash -n scripts/start_emotion_llama.sh
          bash -n scripts/start_r1_omni.sh
          bash -n scripts/lib_postgres.sh
          bash -n scripts/backup_postgres.sh
          bash -n scripts/restore_postgres.sh
