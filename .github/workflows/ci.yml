name: Commercial Foundation CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: commercial-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: UI_API
    env:
      APP_ENV: test
      # The profile defaults to postgresql, and only conftest.py setdefaults sqlite,
      # so the plain `from main import app` step below needs this stated explicitly.
      # PostgreSQL behaviour is covered by the postgres-migration job.
      DATABASE_BACKEND: sqlite
      DATABASE_URL: ""
      SECURITY_ENFORCED: "false"
      ENABLE_DEMO_ROUTES: "false"
      ENABLE_DIAGNOSTIC_ROUTES: "false"
      ENABLE_DEBUG_ROUTES: "false"
      ENABLE_NGROK: "false"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: UI_API/requirements-ci.txt

      - name: Install CPU-only CI dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      # A hand-listed path set broke this job twice: once when three files were
      # deleted under it, once when new route modules were never added to it.
      # The tree scans clean, so there is nothing to buy by enumerating it.
      - name: Ruff lint
        if: matrix.python-version == '3.10'
        run: ruff check . ../tools/generate_api_types.py

      - name: Ruff format check
        if: matrix.python-version == '3.10'
        run: ruff format --check . ../tools/generate_api_types.py

      - name: Mypy gradual type check
        if: matrix.python-version == '3.10'
        run: mypy

      - name: Import application without lifespan or model startup
        run: python -c "from main import app; assert app.title == 'Smart Ordering Kiosk API'"

      - name: Pytest
        run: pytest -q tests

  postgres-migration:
    name: PostgreSQL migration integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: migration_ci
          POSTGRES_DB: migration_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migration_ci -d migration_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: UI_API
    env:
      APP_ENV: test
      # MEMBER_STORAGE_BACKEND is a rejected legacy selection key: setting it makes
      # load_profile() raise PersistenceConfigurationError. DATABASE_URL selects PostgreSQL.
      DATABASE_BACKEND: postgresql
      DATABASE_URL: postgresql://migration_ci@127.0.0.1:5432/migration_ci
      # Schema migration refuses to run on the runtime credential and requires its own.
      MIGRATION_DATABASE_URL: postgresql://migration_ci@127.0.0.1:5432/migration_ci
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: UI_API/requirements-ci.txt

      - name: Install PostgreSQL integration dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Inspect pending migrations
        run: python backend/scripts/manage_postgres_migrations.py status

      - name: Validate migration sources
        run: python backend/scripts/manage_postgres_migrations.py validate

      # The per-area integration suites this job used to name were deleted in 06dd4b9
      # and the workflow was never updated, so it has failed on a missing path ever
      # since. The contract suite runs here instead, against PostgreSQL rather than
      # the SQLite default, which is the only place the pilot's database is covered.
      - name: Apply migrations
        run: python backend/scripts/manage_postgres_migrations.py apply

      - name: Backend contract suite on PostgreSQL
        run: pytest -q tests

      - name: Reapply migrations safely
        run: python backend/scripts/manage_postgres_migrations.py apply

      - name: Validate commercial scope integrity
        run: python backend/scripts/validate_commercial_scope.py --require-complete

      - name: Backfill and validate Member identity integrity
        run: python backend/scripts/verify_member_identity_migration.py --backfill --require-clean

      - name: Validate clean migration state
        run: python backend/scripts/manage_postgres_migrations.py validate --require-clean

  frontend:
    name: Frontend type and syntax checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHON_BIN: python
    defaults:
      run:
        working-directory: UI_API/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: UI_API/frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend smoke backend dependencies
        working-directory: UI_API
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Install frontend toolchain
        run: npm ci --ignore-scripts

      - name: Type check
        run: npm run typecheck

      - name: Build independent frontend entries
        run: npm run build

      - name: Frontend unit tests
        run: npm run test:coverage

      - name: JavaScript syntax
        run: npm run syntax

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Critical Kiosk and Admin smoke tests
        run: npm run test:e2e

  redis-integration:
    name: Redis shared infrastructure integration
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      redis:
        image: redis:8.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: UI_API
    env:
      APP_ENV: test
      # MEMBER_STORAGE_BACKEND is a rejected legacy selection key: setting it makes
      # load_profile() raise PersistenceConfigurationError, so it stays unset here.
      DATABASE_URL: ""
      REDIS_URL: redis://127.0.0.1:6379/15
      SHARED_RATE_LIMIT_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: UI_API/requirements-ci.txt
      - name: Install CPU-only dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Verify shared cache, rate limit, scope, TTL and lock
        run: pytest -q tests/redis_shared_integration.py

  shell:
    name: Shell syntax checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate launch scripts
        run: |
          sh -n docker/scripts/test.sh
          sh -n docker/scripts/test-ai.sh
