<h2>設定區塊設計</h2>
<p class="subtitle">點擊底部導航後的畫面樣式。以「Emotion / AI 設定」為例。</p>

<div class="mockup">
  <div class="mockup-header">😊 Emotion / AI 設定頁</div>
  <div class="mockup-body" style="background:#f8fafc;font-family:sans-serif;padding:0;overflow:hidden">

    <!-- Sub-page top bar -->
    <div style="background:#fff;border-bottom:1px solid #e2e8f0;padding:10px 16px;display:flex;align-items:center;gap:12px">
      <button style="background:#f1f5f9;border:none;border-radius:6px;padding:5px 10px;font-size:12px;color:#64748b;cursor:pointer">← 返回監控</button>
      <span style="font-size:14px;font-weight:700;color:#1e1b4b">Emotion / AI 設定</span>
    </div>

    <div style="padding:14px 16px;display:flex;flex-direction:column;gap:10px">

      <!-- Section: 情緒偵測 -->
      <div style="background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)">
        <div style="font-size:11px;color:#7c3aed;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px">情緒偵測</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <div>
            <label style="font-size:11px;color:#64748b;display:block;margin-bottom:3px">偵測間隔（秒）</label>
            <input style="width:100%;border:1px solid #e2e8f0;border-radius:6px;padding:6px 10px;font-size:13px;color:#1e293b;background:#f8fafc" type="number" value="12" />
          </div>
          <div>
            <label style="font-size:11px;color:#64748b;display:block;margin-bottom:3px">影片截取長度（秒）</label>
            <input style="width:100%;border:1px solid #e2e8f0;border-radius:6px;padding:6px 10px;font-size:13px;color:#1e293b;background:#f8fafc" type="number" value="3" />
          </div>
          <div>
            <label style="font-size:11px;color:#64748b;display:block;margin-bottom:3px">音量門檻（dBFS）</label>
            <input style="width:100%;border:1px solid #e2e8f0;border-radius:6px;padding:6px 10px;font-size:13px;color:#1e293b;background:#f8fafc" type="number" value="-58" />
          </div>
          <div>
            <label style="font-size:11px;color:#64748b;display:block;margin-bottom:3px">推播最短間隔（秒）</label>
            <input style="width:100%;border:1px solid #e2e8f0;border-radius:6px;padding:6px 10px;font-size:13px;color:#1e293b;background:#f8fafc" type="number" value="30" />
          </div>
        </div>
      </div>

      <!-- Section: LLM 推論 -->
      <div style="background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)">
        <div style="font-size:11px;color:#0891b2;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px">LLM 推論</div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">
          <div>
            <label style="font-size:11px;color:#64748b;display:block;margin-bottom:3px">推論溫度</label>
            <input style="width:100%;border:1px solid #e2e8f0;border-radius:6px;padding:6px 10px;font-size:13px;color:#1e293b;background:#f8fafc" type="number" value="0.7" step="0.1" />
          </div>
          <div>
            <label style="font-size:11px;color:#64748b;display:block;margin-bottom:3px">輸出上限（tokens）</label>
            <input style="width:100%;border:1px solid #e2e8f0;border-radius:6px;padding:6px 10px;font-size:13px;color:#1e293b;background:#f8fafc" type="number" value="512" />
          </div>
          <div>
            <label style="font-size:11px;color:#64748b;display:block;margin-bottom:3px">問答來源</label>
            <select style="width:100%;border:1px solid #e2e8f0;border-radius:6px;padding:6px 10px;font-size:13px;color:#1e293b;background:#f8fafc">
              <option>Ollama（本地）</option>
              <option>Gemini API</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Section: Prompt 設定 -->
      <div style="background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)">
        <div style="font-size:11px;color:#059669;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px">Prompt 設定</div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <div>
            <label style="font-size:11px;color:#64748b;display:block;margin-bottom:3px">語音問答 Prompt（繁中）</label>
            <textarea style="width:100%;border:1px solid #e2e8f0;border-radius:6px;padding:8px 10px;font-size:11px;color:#1e293b;background:#f8fafc;resize:vertical;height:52px;font-family:monospace">你是智慧自助點餐系統的語音助理...</textarea>
          </div>
          <div>
            <label style="font-size:11px;color:#64748b;display:block;margin-bottom:3px">推播推薦 Prompt</label>
            <textarea style="width:100%;border:1px solid #e2e8f0;border-radius:6px;padding:8px 10px;font-size:11px;color:#1e293b;background:#f8fafc;resize:vertical;height:52px;font-family:monospace">根據顧客情緒與障礙類型推薦最適合的套餐...</textarea>
          </div>
        </div>
      </div>

      <!-- Section: 答案品質 -->
      <div style="background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)">
        <div style="font-size:11px;color:#d97706;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px">答案品質</div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:#374151;cursor:pointer">
            <input type="checkbox" checked style="accent-color:#7c3aed" /> 嚴格來源限制（僅從 RAG 知識庫回答）
          </label>
          <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:#374151;cursor:pointer">
            <input type="checkbox" checked style="accent-color:#7c3aed" /> LLM 答案驗證
          </label>
          <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:#374151;cursor:pointer">
            <input type="checkbox" style="accent-color:#7c3aed" /> 評估失敗時拒答
          </label>
        </div>
      </div>

      <!-- Save button -->
      <button style="background:#7c3aed;color:#fff;border:none;border-radius:8px;padding:10px;font-size:13px;font-weight:600;cursor:pointer;width:100%">儲存設定</button>

    </div>
  </div>
</div>

<p class="subtitle" style="margin-top:12px">其他三個設定頁（影像片段、菜單管理、RAG）也用相同的「返回監控 + 白色卡片」結構。這個設計看起來如何？</p>
