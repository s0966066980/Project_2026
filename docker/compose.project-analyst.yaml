# The Project Analyst Sidecar.
#
# An opt-in overlay, not part of the default stack. Project analysis is a
# reference-only capability over the project itself (ADR-0047); the ordering
# system runs, and must be able to run, without it.
#
#   docker compose --env-file .env \
#     -f docker/compose.yaml \
#     -f docker/compose.project-analyst.yaml \
#     up -d --wait
#
# Provider credentials are optional here on purpose. Without them every profile
# reports `credential_missing` and is not selectable, which is the correct
# closed state — an analyst sidecar with no credentials must refuse, never fall
# back to some other provider or to running in the App process.
#
# To supply one, point the matching PROJECT_ANALYST_*_CREDENTIAL_FILE at a
# host-external file owned by uid 10002 with mode 0600 and uncomment its secret.

services:
  # The app reaches the sidecar by service name over the compose network. It is
  # not a dependency: project analysis being down must never stop ordering, so
  # there is no depends_on and the client treats an unreachable sidecar as a
  # bounded, visible failure of that one Admin operation.
  app:
    environment:
      PROJECT_ANALYST_BASE_URL: http://project-analyst:7900

  project-analyst:
    build:
      context: ..
      dockerfile: docker/project-analyst.Dockerfile
    image: project-2026-project-analyst:local
    restart: unless-stopped

    # The same contract the Pilot app and worker run under, for the same
    # reason: this is the one process in the system that hands project text to
    # an external provider CLI.
    user: "10002:10002"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      # A provider CLI needs somewhere to write its own scratch state. It gets
      # this and nothing else; the root filesystem stays read-only.
      - /tmp:mode=1777,size=128m,nosuid,nodev

    # Bounded because an analysis is an Admin-triggered operation sharing a host
    # with the ordering system. A provider CLI that decides to index everything
    # must hit a limit rather than the Kiosk's latency.
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0

    environment:
      PROJECT_ANALYST_TIMEOUT_SECONDS: "${PROJECT_ANALYST_TIMEOUT_SECONDS:-300}"
      PROJECT_ANALYST_SECRET_ROOT: /run/secrets
      PROJECT_ANALYST_HOME: /tmp/project-analyst

    # Deliberately absent, and each absence is a decision:
    #   volumes:      no repository, no app_data, no runtime data of any kind.
    #                 Everything analysable arrives in the request body.
    #   /var/run/docker.sock: the sidecar cannot start containers.
    #   depends_on postgres: it has no database reach at all.
    #
    # The port is not published to the host either. Only the app talks to it,
    # over the compose network.
    expose:
      - "7900"

