# Full in-container AI stack. Use together with compose.yaml.
services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: ai-runtime
      args:
        APP_GIT_REVISION: ${APP_GIT_REVISION:-unknown}
        APP_BUILD_TIME: ${APP_BUILD_TIME:-unknown}
    image: project-2026:ai
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_API_URL: http://ollama:11434/api/generate
      MODEL_NAME: ${OLLAMA_MODEL:-qwen3.5:4b}
      VOICE_ASSIST_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b}
      VOICE_LLM_PREWARM_ENABLED: "true"
      # The Admin AI settings page reads the authenticated /api/ollama/models
      # diagnostic endpoint to populate the local-model selectors.
      ENABLE_DIAGNOSTIC_ROUTES: "true"
      RAG_ENABLED: "true"
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      RAG_STRATEGY: ${RAG_STRATEGY:-hybrid}
      STT_PROVIDER: faster_whisper
      STT_MODEL: ${STT_MODEL:-small}
      TTS_PROVIDER: edge
      EDGE_TTS_VOICE: ${EDGE_TTS_VOICE:-zh-TW-HsiaoChenNeural}
      EMOTION_CAPTURE_MODE: ${EMOTION_CAPTURE_MODE:-off}
      R1_OMNI_GRADIO_URL: http://r1-omni:7890
      TMPDIR: /tmp/project-2026-media
      HF_HOME: /home/project2026/.cache/huggingface
    volumes:
      - app_data:/var/lib/project-2026
      - ai_cache:/home/project2026/.cache
      - shared_media:/tmp/project-2026-media
    healthcheck:
      # Ten minutes was the price of warm-up blocking the lifespan: the service
      # answered nothing until the models had loaded. Warm-up now runs beside
      # the service (ADR-0060) and `/ready` answers within seconds, so a long
      # grace period no longer buys anything — it only keeps a genuinely broken
      # app looking like it is still starting.
      start_period: 120s

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: ai-runtime
      args:
        APP_GIT_REVISION: ${APP_GIT_REVISION:-unknown}
        APP_BUILD_TIME: ${APP_BUILD_TIME:-unknown}
    image: project-2026:ai
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_API_URL: http://ollama:11434/api/generate
      MODEL_NAME: ${OLLAMA_MODEL:-qwen3.5:4b}
      RAG_ENABLED: "true"
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      STT_PROVIDER: faster_whisper
      STT_MODEL: ${STT_MODEL:-small}
      TTS_PROVIDER: edge
      EMOTION_CAPTURE_MODE: ${EMOTION_CAPTURE_MODE:-off}
      R1_OMNI_GRADIO_URL: http://r1-omni:7890
      TMPDIR: /tmp/project-2026-media
      HF_HOME: /home/project2026/.cache/huggingface
    volumes:
      - app_data:/var/lib/project-2026
      - ai_cache:/home/project2026/.cache
      - shared_media:/tmp/project-2026-media

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    restart: unless-stopped
    # The GPU is required, not preferred. Ollama does not refuse to start
    # without one: it reports the CUDA device it saw at boot, then falls back
    # to CPU inside llama-server and says nothing. On 2026-08-13 that turned a
    # one-second reply into a two-minute timeout with no error anywhere.
    gpus: all
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      # Both halves matter. `ollama list` says the daemon answers; `nvidia-smi`
      # says the container can still reach the GPU it was granted. Device
      # access can be revoked from a running container — after a driver update
      # or a systemd daemon-reload — and nothing else reports it.
      test: ["CMD-SHELL", "nvidia-smi -L >/dev/null 2>&1 && ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  r1-omni:
    build:
      context: ..
      dockerfile: docker/R1-Omni.Dockerfile
      target: gpu
    image: project-2026-r1-omni:gpu
    restart: unless-stopped
    gpus: all
    environment:
      # cuda, not auto: emotion inference on CPU is slow enough to miss the
      # interaction it is describing, so an unavailable GPU has to fail here
      # rather than quietly produce late evidence.
      R1_OMNI_DEVICE: cuda
      R1_OMNI_PRELOAD: "true"
      R1_OMNI_MODEL_ROOT: /models
      R1_OMNI_ALLOWED_VIDEO_DIR: /tmp/project-2026-media
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - ${R1_MODELS_PATH:-../R1-Omni/models}:/models:ro
      - shared_media:/tmp/project-2026-media
    ports:
      - "127.0.0.1:${R1_OMNI_PORT:-7890}:7890"
    shm_size: 2gb
    healthcheck:
      start_period: 10m

volumes:
  ai_cache:
  ollama_models:
  shared_media:
