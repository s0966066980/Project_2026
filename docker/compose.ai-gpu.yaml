# NVIDIA GPU overrides for compose.ai.yaml. Requires NVIDIA Container Toolkit.
services:
  ollama:
    gpus: all

  r1-omni:
    build:
      context: ..
      dockerfile: docker/R1-Omni.Dockerfile
      target: gpu
    image: project-2026-r1-omni:gpu
    gpus: all
    environment:
      R1_OMNI_DEVICE: cuda
    healthcheck:
      start_period: 10m
