[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
  ".venv",
  ".codegraph",
  "learning_data",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = [
  "api",
  "bootstrap",
  "core",
  "models",
  "repositories",
  "routes",
  "services",
  "utils",
]

[tool.ruff.lint.per-file-ignores]
# main.py must add backend/ to sys.path before importing the application modules.
"main.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
mypy_path = "backend"
explicit_package_bases = true
follow_imports = "silent"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
files = [
  "backend/api",
  "backend/core",
  "backend/models",
  "backend/repositories/postgres_utils.py",
  "backend/repositories/admin_identity_repository.py",
  "backend/repositories/device_identity_repository.py",
  "backend/routes/admin_identity_routes.py",
  "backend/routes/device_identity_routes.py",
  "backend/scripts/manage_postgres_migrations.py",
  "backend/scripts/manage_admin_identity.py",
  "backend/scripts/validate_commercial_scope.py",
  "backend/services/commercial_scope_service.py",
  "backend/services/commercial_scope_readiness_service.py",
  "backend/services/admin_access_service.py",
  "backend/services/admin_authorization_service.py",
  "backend/services/admin_identity_service.py",
  "backend/services/device_identity_service.py",
  "backend/utils",
]
