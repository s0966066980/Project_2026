<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 推播系統 · Admin</title>
<link rel="icon" href="data:;base64,iVBORw0KGgo=">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Segoe UI', 'Noto Sans TC', system-ui, sans-serif;
  background: #f4f6fa;
  color: #1a2233;
  display: flex;
  height: 100dvh;
  overflow: hidden;
}

/* ── Sidebar ── */
.sidebar {
  width: 220px;
  flex-shrink: 0;
  background: #1a2233;
  display: flex;
  flex-direction: column;
  height: 100%;
}
.sidebar-brand {
  padding: 28px 22px 20px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.sidebar-brand-title {
  font-size: 15px;
  font-weight: 800;
  color: #fff;
  line-height: 1.3;
}
.sidebar-brand-sub {
  font-size: 11px;
  color: rgba(255,255,255,0.4);
  margin-top: 3px;
}
.sidebar-nav {
  flex: 1;
  padding: 16px 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  overflow-y: auto;
}
.nav-section-label {
  font-size: 10px;
  font-weight: 700;
  color: rgba(255,255,255,0.28);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 10px 10px 4px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: 8px;
  color: rgba(255,255,255,0.6);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.15s;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
}
.nav-item i { width: 16px; text-align: center; font-size: 14px; }
.nav-item:hover { background: rgba(255,255,255,0.08); color: #fff; }
.nav-item.active { background: #3b7aee; color: #fff; }
.sidebar-footer {
  padding: 16px 12px;
  border-top: 1px solid rgba(255,255,255,0.08);
}

/* ── Main area ── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.topbar {
  background: #fff;
  border-bottom: 1px solid #e8ecf4;
  padding: 14px 28px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
}
.topbar-title { font-size: 18px; font-weight: 800; color: #1a2233; }
.topbar-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; white-space: nowrap; }
.topbar-date { font-size: 12px; color: #8494b0; }
.refresh-btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 14px;
  background: #f4f6fa; border: 1.5px solid #dde3f0;
  border-radius: 8px; font-size: 12px; font-weight: 700;
  color: #3b4a6b; cursor: pointer; transition: background 0.15s;
}
.refresh-btn:hover { background: #e8ecf4; }
.refresh-btn, .clear-btn { flex-shrink: 0; white-space: nowrap; }
.clear-btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 14px;
  background: #fff0f0; border: 1.5px solid #fcc;
  border-radius: 8px; font-size: 12px; font-weight: 700;
  color: #c0392b; cursor: pointer; transition: background 0.15s;
}
.clear-btn:hover { background: #ffe0e0; border-color: #e84040; }
.clear-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.content {
  flex: 1;
  overflow-y: auto;
  padding: 24px 28px;
  display: flex;
  flex-direction: column;
  gap: 22px;
}

/* ── Summary row ── */
.summary-row {
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: 20px;
}
.donut-card {
  background: #fff;
  border-radius: 16px;
  padding: 22px;
  box-shadow: 0 1px 6px rgba(26,34,51,0.07);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}
.donut-title { font-size: 13px; font-weight: 700; color: #1a2233; align-self: flex-start; }
.donut-wrap { position: relative; width: 130px; height: 130px; }
.donut-svg { transform: rotate(-90deg); }
.donut-track { fill: none; stroke: #edf0f7; stroke-width: 16; }
.donut-fill  { fill: none; stroke: #3b7aee; stroke-width: 16; stroke-linecap: round; transition: stroke-dasharray 0.8s ease; }
.donut-center {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
}
.donut-pct  { font-size: 28px; font-weight: 900; color: #1a2233; line-height: 1; }
.donut-sub  { font-size: 11px; color: #8494b0; margin-top: 2px; }
.donut-legend { display: flex; flex-direction: column; gap: 8px; width: 100%; }
.legend-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #3b4a6b; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.legend-row span:last-child { margin-left: auto; font-weight: 700; color: #1a2233; }

.stat-cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
.stat-card {
  background: #fff;
  border-radius: 14px;
  padding: 18px 20px;
  box-shadow: 0 1px 6px rgba(26,34,51,0.07);
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.stat-card-icon {
  width: 36px; height: 36px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0; margin-bottom: 4px;
}
.stat-card-icon.blue   { background: #e8f0fe; color: #3b7aee; }
.stat-card-icon.green  { background: #e6f7ef; color: #1db87a; }
.stat-card-icon.orange { background: #fff4e5; color: #f5871f; }
.stat-card-icon.red    { background: #feecec; color: #e84040; }
.stat-label { font-size: 12px; color: #8494b0; font-weight: 600; }
.stat-value { font-size: 28px; font-weight: 900; color: #1a2233; line-height: 1; }

/* ── Bottom row ── */
.bottom-row {
  display: grid;
  grid-template-columns: 320px 1fr;
  gap: 20px;
}
.card {
  background: #fff;
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 1px 6px rgba(26,34,51,0.07);
}
.card-title {
  font-size: 13px; font-weight: 800; color: #1a2233;
  margin-bottom: 14px;
  display: flex; align-items: center; gap: 8px;
}
.card-title i { color: #3b7aee; }

/* Top-3 list */
.top3-list { display: flex; flex-direction: column; gap: 12px; }
.top3-item { display: flex; align-items: center; gap: 12px; }
.top3-rank {
  width: 24px; height: 24px; border-radius: 50%;
  font-size: 11px; font-weight: 900;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.top3-rank.r1 { background: #ffd43b; color: #7a5500; }
.top3-rank.r2 { background: #dee2e6; color: #495057; }
.top3-rank.r3 { background: #e8d5c4; color: #7a4b2a; }
.top3-img {
  width: 44px; height: 44px; border-radius: 10px;
  background: #f4f6fa; object-fit: contain;
  flex-shrink: 0; border: 1px solid #e8ecf4;
}
.top3-name { font-size: 13px; font-weight: 700; color: #1a2233; }
.top3-count { font-size: 11px; color: #8494b0; margin-top: 2px; }
.top3-bar-wrap { flex: 1; }
.top3-bar-track { height: 6px; background: #edf0f7; border-radius: 999px; overflow: hidden; }
.top3-bar-fill  { height: 100%; border-radius: 999px; background: #3b7aee; }

/* Table */
.adm-table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
thead th {
  background: #f8fafd; padding: 9px 14px; text-align: left;
  font-size: 10px; font-weight: 700; color: #8494b0;
  text-transform: uppercase; letter-spacing: 0.05em;
  border-bottom: 1.5px solid #edf0f7;
}
tbody td { padding: 9px 14px; border-bottom: 1px solid #f4f6fa; color: #2d3a55; vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: #f8fafd; }
.adm-empty { text-align: center; color: #adb5c9; padding: 24px; font-size: 13px; }
.badge-ok  { background: #e6f7ef; color: #1db87a; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; }
.badge-no  { background: #feecec; color: #e84040; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; }

@media (max-width: 1100px) {
  .summary-row { grid-template-columns: 1fr; }
  .bottom-row   { grid-template-columns: 1fr; }
  .stat-cards   { grid-template-columns: repeat(2,1fr); }
}
@media (max-width: 700px) {
  .sidebar { display: none; }
  .stat-cards { grid-template-columns: 1fr; }
  .content { padding: 16px; }
}
.setting-row { display:flex; align-items:center; gap:14px; margin-bottom:10px; }
.setting-label { width:110px; flex-shrink:0; font-size:12px; font-weight:600; color:#3b4a6b; }
.setting-input {
  flex:1; padding:7px 10px; border:1.5px solid #dde3f0; border-radius:8px;
  font-size:13px; color:#1a2233; background:#fff; outline:none;
}
.setting-input:focus { border-color:#3b7aee; }
.hidden { display:none !important; }
</style>
</head>
<body>

<!-- ── Sidebar ── -->
<aside class="sidebar">
  <div class="sidebar-brand">
    <div class="sidebar-brand-title">AI 推播系統</div>
    <div class="sidebar-brand-sub">Admin 管理台</div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-section-label">主選單</div>
    <button class="nav-item active" data-page="stats" type="button">
      <i class="fas fa-chart-pie"></i> 狀態統計
    </button>
    <button class="nav-item" data-page="settings" type="button">
      <i class="fas fa-sliders-h"></i> 功能設定
    </button>
  </nav>
  <div class="sidebar-footer">
    <button class="nav-item" type="button" onclick="location.href='/'">
      <i class="fas fa-arrow-left"></i> 返回 POS
    </button>
  </div>
</aside>

<!-- ── Main ── -->
<div class="main">
  <div class="topbar">
    <div class="topbar-title" id="page-title">狀態統計</div>
    <div class="topbar-right">
      <span class="topbar-date" id="topbar-date"></span>
      <button class="refresh-btn" id="refreshBtn" type="button">
        <i class="fas fa-sync-alt"></i> 重新整理
      </button>
      <button class="clear-btn" id="clearBtn" type="button">
        <i class="fas fa-trash-alt"></i> 清除統計
      </button>
    </div>
  </div>

  <!-- Stats page -->
  <div class="content" id="page-stats">

    <div class="summary-row">
      <!-- Donut chart -->
      <div class="donut-card">
        <div class="donut-title">推播成功率</div>
        <div class="donut-wrap">
          <svg class="donut-svg" width="130" height="130" viewBox="0 0 130 130">
            <circle class="donut-track" cx="65" cy="65" r="49"/>
            <circle class="donut-fill" id="donut-fill" cx="65" cy="65" r="49"
                    stroke-dasharray="0 308" stroke-dashoffset="0"/>
          </svg>
          <div class="donut-center">
            <div class="donut-pct" id="d-rate">—</div>
            <div class="donut-sub">成功率</div>
          </div>
        </div>
        <div class="donut-legend">
          <div class="legend-row">
            <span class="legend-dot" style="background:#3b7aee"></span>
            <span>成功次數</span>
            <span id="d-success">—</span>
          </div>
          <div class="legend-row">
            <span class="legend-dot" style="background:#e8ecf4"></span>
            <span>未加購次數</span>
            <span id="d-fail">—</span>
          </div>
          <div class="legend-row">
            <span class="legend-dot" style="background:#f5871f"></span>
            <span>累計效益分數</span>
            <span id="d-score">—</span>
          </div>
        </div>
      </div>

      <!-- 4 stat cards -->
      <div class="stat-cards">
        <div class="stat-card">
          <div class="stat-card-icon blue"><i class="fas fa-paper-plane"></i></div>
          <div class="stat-label">推播次數</div>
          <div class="stat-value" id="s-total">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-icon green"><i class="fas fa-hand-pointer"></i></div>
          <div class="stat-label">點擊次數</div>
          <div class="stat-value" id="s-clicks">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-icon orange"><i class="fas fa-times-circle"></i></div>
          <div class="stat-label">未點擊推播次數</div>
          <div class="stat-value" id="s-fail">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-icon red"><i class="fas fa-percentage"></i></div>
          <div class="stat-label">未點擊率</div>
          <div class="stat-value" id="s-fail-rate">—</div>
        </div>
      </div>
    </div>

    <div class="bottom-row">
      <!-- Top 3 -->
      <div class="card">
        <div class="card-title"><i class="fas fa-trophy"></i> 點選次數 TOP 3</div>
        <div class="top3-list" id="top3-list">
          <div style="color:#adb5c9;font-size:12px">載入中…</div>
        </div>
      </div>

      <!-- Session table -->
      <div class="card">
        <div class="card-title"><i class="fas fa-list-alt"></i> 點餐記錄明細</div>
        <div class="adm-table-wrap">
          <table>
            <thead>
              <tr>
                <th>時間</th>
                <th>Session ID</th>
                <th>AI 加購次數</th>
                <th>推播結果</th>
                <th>最終購物車</th>
                <th>加入方式</th>
              </tr>
            </thead>
            <tbody id="s-tbody">
              <tr><td colspan="6" class="adm-empty">載入中…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <!-- Settings page -->
  <div class="content" id="page-settings" style="display:none">
    <div class="card" style="max-width:640px">
      <div class="card-title"><i class="fas fa-sliders-h"></i> 功能設定</div>

      <div style="display:flex;flex-direction:column;gap:20px">

        <!-- Ollama -->
        <section>
          <div style="font-size:12px;font-weight:800;color:#1a2233;margin-bottom:10px;text-transform:uppercase;letter-spacing:.05em">Ollama 語音模型</div>
          <div class="setting-row">
            <label class="setting-label">語音 LLM 模型</label>
            <input id="inp-voice-model" class="setting-input" type="text" placeholder="qwen3.5:4b">
          </div>
        </section>

        <hr style="border:none;border-top:1px solid #edf0f7">

        <!-- STT -->
        <section>
          <div style="font-size:12px;font-weight:800;color:#1a2233;margin-bottom:10px;text-transform:uppercase;letter-spacing:.05em">STT（語音辨識）</div>
          <div class="setting-row">
            <label class="setting-label">提供者</label>
            <select id="inp-stt-provider" class="setting-input" onchange="onSttProviderChange()">
              <option value="faster_whisper">faster-whisper（本地）</option>
              <option value="openai_compatible">OpenAI 相容 API</option>
            </select>
          </div>
          <div class="setting-row" id="row-stt-model">
            <label class="setting-label">模型大小</label>
            <select id="inp-stt-model" class="setting-input">
              <option value="tiny">tiny（最快，準確度較低）</option>
              <option value="small">small（推薦）</option>
              <option value="medium">medium（最準，較慢）</option>
            </select>
          </div>
          <div class="setting-row hidden" id="row-stt-api">
            <label class="setting-label">API URL</label>
            <input id="inp-stt-api-url" class="setting-input" type="text" placeholder="https://api.openai.com">
          </div>
          <div class="setting-row hidden" id="row-stt-key">
            <label class="setting-label">API Key</label>
            <input id="inp-stt-api-key" class="setting-input" type="password" placeholder="sk-xxx 或 none">
          </div>
        </section>

        <hr style="border:none;border-top:1px solid #edf0f7">

        <!-- TTS -->
        <section>
          <div style="font-size:12px;font-weight:800;color:#1a2233;margin-bottom:10px;text-transform:uppercase;letter-spacing:.05em">TTS（語音合成）</div>
          <div class="setting-row">
            <label class="setting-label">提供者</label>
            <select id="inp-tts-provider" class="setting-input" onchange="onTtsProviderChange()">
              <option value="edge">Edge TTS（雲端，需網路）</option>
              <option value="melo">MeloTTS（本地）</option>
              <option value="openai_compatible">OpenAI 相容 API</option>
            </select>
          </div>
          <div class="setting-row" id="row-tts-edge-zh">
            <label class="setting-label">中文語音</label>
            <input id="inp-tts-voice-zh" class="setting-input" type="text" placeholder="zh-TW-HsiaoChenNeural">
          </div>
          <div class="setting-row" id="row-tts-edge-en">
            <label class="setting-label">英文語音</label>
            <input id="inp-tts-voice-en" class="setting-input" type="text" placeholder="en-US-JennyNeural">
          </div>
          <div class="setting-row hidden" id="row-tts-api">
            <label class="setting-label">API URL</label>
            <input id="inp-tts-api-url" class="setting-input" type="text" placeholder="https://api.openai.com">
          </div>
          <div class="setting-row hidden" id="row-tts-key">
            <label class="setting-label">API Key</label>
            <input id="inp-tts-api-key" class="setting-input" type="password" placeholder="sk-xxx 或 none">
          </div>
          <div class="setting-row hidden" id="row-tts-voice">
            <label class="setting-label">聲音名稱</label>
            <input id="inp-tts-voice" class="setting-input" type="text" placeholder="alloy">
          </div>
        </section>

        <div style="display:flex;align-items:center;gap:12px;margin-top:4px">
          <button class="refresh-btn" id="saveSettingsBtn" type="button" onclick="saveSettings()" style="background:#3b7aee;color:#fff;border-color:#3b7aee">
            <i class="fas fa-save"></i> 儲存設定
          </button>
          <span id="settings-notice" style="font-size:12px;color:#1db87a;display:none"></span>
        </div>
      </div>
    </div>
  </div>

</div>

<script type="module" src="/static/admin/admin.js"></script>
</body>
</html>
