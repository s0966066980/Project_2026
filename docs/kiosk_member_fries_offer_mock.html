<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiosk 會員薯條加購活動卡 Mock</title>
<style>
  :root {
    --mcd-red: #da291c;
    --mcd-yellow: #ffc72c;
    --ink: #231f20;
    --muted: #6f665b;
    --paper: #fffaf0;
    --surface: #ffffff;
    --line: #eadfcd;
    --shadow: 0 18px 42px rgba(45, 32, 18, 0.16);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #292520;
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
    color: var(--ink);
  }

  .kiosk-frame {
    width: min(1180px, 96vw);
    aspect-ratio: 16 / 9;
    overflow: hidden;
    display: grid;
    grid-template-rows: 88px 1fr 88px;
    background:
      radial-gradient(circle at 12% 0%, rgba(255, 199, 44, 0.22), transparent 24%),
      linear-gradient(180deg, #fffdf7 0%, #f5eee3 100%);
    border: 10px solid #161412;
    border-radius: 28px;
    box-shadow: 0 28px 90px rgba(0, 0, 0, 0.42);
  }

  .topbar,
  .bottom-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 34px;
    background: rgba(255, 255, 255, 0.86);
    border-bottom: 1px solid rgba(234, 223, 205, 0.82);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
    font-weight: 900;
    font-size: 22px;
  }

  .arches {
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    border-radius: 15px;
    background: var(--mcd-red);
    color: var(--mcd-yellow);
    font-size: 34px;
    line-height: 1;
    font-family: Georgia, serif;
  }

  .member-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-radius: 999px;
    background: #fff4cf;
    border: 1px solid #f5d66b;
    color: #8b5200;
    font-size: 14px;
    font-weight: 900;
  }

  .screen {
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 22px;
    padding: 24px 30px;
  }

  .menu-area {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .section-head {
    display: flex;
    justify-content: space-between;
    align-items: end;
  }

  .section-head h1 {
    margin: 0;
    font-size: 34px;
    line-height: 1;
    letter-spacing: 0;
  }

  .section-head p {
    margin: 8px 0 0;
    color: var(--muted);
    font-size: 15px;
    font-weight: 700;
  }

  .category-tabs {
    display: flex;
    gap: 8px;
  }

  .category-tabs span {
    padding: 9px 14px;
    border-radius: 999px;
    background: #fff;
    border: 1px solid var(--line);
    color: var(--muted);
    font-size: 13px;
    font-weight: 900;
  }

  .category-tabs .active {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }

  .menu-grid {
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
  }

  .menu-card,
  .offer-card {
    min-height: 214px;
    border-radius: 18px;
    background: var(--surface);
    border: 1px solid var(--line);
    box-shadow: 0 10px 24px rgba(86, 64, 40, 0.08);
    overflow: hidden;
  }

  .menu-card {
    display: grid;
    grid-template-rows: 116px 1fr;
  }

  .menu-photo {
    display: grid;
    place-items: center;
    background: #fff8e8;
  }

  .menu-photo img {
    width: 108px;
    height: 108px;
    object-fit: contain;
  }

  .menu-copy {
    padding: 14px 16px 16px;
  }

  .menu-copy strong,
  .offer-copy strong {
    display: block;
    font-size: 18px;
    line-height: 1.25;
  }

  .menu-copy span {
    display: block;
    margin-top: 8px;
    color: var(--mcd-red);
    font-size: 20px;
    font-weight: 900;
  }

  .offer-card {
    position: relative;
    display: flex;
    flex-direction: column;
    padding: 16px;
    background:
      linear-gradient(145deg, rgba(255, 199, 44, 0.28), rgba(255, 255, 255, 0.88) 44%),
      #fff;
    border: 2px solid var(--mcd-yellow);
    box-shadow: var(--shadow);
  }

  .offer-ribbon {
    width: fit-content;
    padding: 5px 10px;
    border-radius: 999px;
    background: var(--mcd-red);
    color: #fff;
    font-size: 12px;
    font-weight: 900;
  }

  .offer-main {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 12px;
  }

  .offer-photo {
    width: 78px;
    height: 78px;
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    border-radius: 18px;
    background: #fff;
    border: 1px solid rgba(234, 223, 205, 0.86);
  }

  .offer-photo img {
    width: 72px;
    height: 72px;
    object-fit: contain;
  }

  .offer-copy {
    min-width: 0;
  }

  .offer-copy p {
    margin: 7px 0 0;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.4;
    font-weight: 700;
  }

  .offer-price {
    margin-top: auto;
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: 12px;
    padding-top: 12px;
  }

  .price-stack {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  .price-stack del {
    color: #9c958d;
    font-size: 14px;
    font-weight: 800;
  }

  .price-stack b {
    color: var(--mcd-red);
    font-size: 30px;
    line-height: 1;
  }

  .offer-button {
    border: 0;
    border-radius: 999px;
    padding: 12px 16px;
    background: var(--mcd-red);
    color: #fff;
    font-size: 15px;
    font-weight: 900;
    white-space: nowrap;
  }

  .cart-panel {
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: rgba(255, 255, 255, 0.88);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 18px;
    box-shadow: 0 12px 32px rgba(86, 64, 40, 0.1);
  }

  .cart-panel h2 {
    margin: 0 0 16px;
    font-size: 22px;
  }

  .cart-line {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
    padding: 13px 0;
    border-bottom: 1px solid #eee2d0;
    font-size: 15px;
    font-weight: 800;
  }

  .cart-line small {
    display: block;
    margin-top: 4px;
    color: var(--muted);
    font-weight: 700;
  }

  .cart-line .discount {
    color: var(--mcd-red);
  }

  .cart-total {
    margin-top: auto;
    padding-top: 18px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    font-weight: 900;
  }

  .cart-total b {
    color: var(--mcd-red);
    font-size: 34px;
  }

  .checkout {
    margin-top: 16px;
    height: 56px;
    border: 0;
    border-radius: 18px;
    background: var(--mcd-yellow);
    color: var(--ink);
    font-size: 18px;
    font-weight: 900;
  }

  .bottom-bar {
    border-top: 1px solid rgba(234, 223, 205, 0.82);
    border-bottom: 0;
  }

  .bottom-actions {
    display: flex;
    gap: 12px;
  }

  .bottom-actions button {
    width: 58px;
    height: 58px;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: #fff;
    font-size: 22px;
  }

  .cart-pill {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 13px 18px;
    border-radius: 18px;
    background: var(--ink);
    color: #fff;
    font-weight: 900;
  }

  @media (max-width: 860px) {
    body { display: block; background: #f5eee3; }
    .kiosk-frame {
      width: 100%;
      min-height: 100vh;
      aspect-ratio: auto;
      border: 0;
      border-radius: 0;
      grid-template-rows: 76px auto 78px;
    }
    .screen {
      grid-template-columns: 1fr;
      padding: 18px;
    }
    .cart-panel { display: none; }
    .menu-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .section-head { align-items: start; flex-direction: column; gap: 12px; }
  }
</style>
</head>
<body>
  <main class="kiosk-frame" aria-label="Kiosk 活動加購示意">
    <header class="topbar">
      <div class="brand">
        <div class="arches">M</div>
        <span>自助點餐</span>
      </div>
      <div class="member-chip">會員已登入 · 歡迎回來</div>
    </header>

    <section class="screen">
      <div class="menu-area">
        <div class="section-head">
          <div>
            <h1>熱門推薦</h1>
            <p>根據會員常點與目前購物車提供加購優惠</p>
          </div>
          <div class="category-tabs" aria-label="分類">
            <span class="active">推薦</span>
            <span>主餐</span>
            <span>點心</span>
          </div>
        </div>

        <div class="menu-grid">
          <article class="offer-card">
            <span class="offer-ribbon">會員限定加購</span>
            <div class="offer-main">
              <div class="offer-photo">
                <img src="https://s7d1.scene7.com/is/image/mcdonalds/french-fries-small_832x822:nutrition-calculator-tile" alt="薯條">
              </div>
              <div class="offer-copy">
                <strong>主餐加購薯條</strong>
                <p>已套用會員活動價，結帳前可直接加入。</p>
              </div>
            </div>
            <div class="offer-price">
              <div class="price-stack">
                <del>$45</del>
                <b>$30</b>
              </div>
              <button class="offer-button" type="button">加入優惠</button>
            </div>
          </article>

          <article class="menu-card">
            <div class="menu-photo">
              <img src="https://s7d1.scene7.com/is/image/mcdonalds/cheese-burger_832x822:nutrition-calculator-tile" alt="吉事漢堡">
            </div>
            <div class="menu-copy">
              <strong>吉事漢堡</strong>
              <span>$100</span>
            </div>
          </article>

          <article class="menu-card">
            <div class="menu-photo">
              <img src="https://s7d1.scene7.com/is/image/mcdonalds/big-mac_832x822:nutrition-calculator-tile" alt="大麥克">
            </div>
            <div class="menu-copy">
              <strong>大麥克</strong>
              <span>$100</span>
            </div>
          </article>

          <article class="menu-card">
            <div class="menu-photo">
              <img src="https://s7d1.scene7.com/is/image/mcdonalds/mcchicken_832x822:nutrition-calculator-tile" alt="麥香雞">
            </div>
            <div class="menu-copy">
              <strong>麥香雞</strong>
              <span>$100</span>
            </div>
          </article>

          <article class="menu-card">
            <div class="menu-photo">
              <img src="https://s7d1.scene7.com/is/image/mcdonalds/coca-cola-small_832x822:nutrition-calculator-tile" alt="可口可樂">
            </div>
            <div class="menu-copy">
              <strong>可口可樂</strong>
              <span>$100</span>
            </div>
          </article>

          <article class="menu-card">
            <div class="menu-photo">
              <img src="https://s7d1.scene7.com/is/image/mcdonalds/oreo-mcflurry_832x822:nutrition-calculator-tile" alt="冰炫風">
            </div>
            <div class="menu-copy">
              <strong>冰炫風</strong>
              <span>$100</span>
            </div>
          </article>
        </div>
      </div>

      <aside class="cart-panel">
        <h2>我的餐點</h2>
        <div class="cart-line">
          <span>吉事漢堡 <small>主餐 · 會員推薦</small></span>
          <strong>$100</strong>
        </div>
        <div class="cart-line">
          <span>薯條 <small>會員加購價已套用</small></span>
          <strong class="discount">$30</strong>
        </div>
        <div class="cart-line">
          <span>活動折抵 <small>example_member_fries</small></span>
          <strong class="discount">-$15</strong>
        </div>
        <div class="cart-total">
          <span>合計</span>
          <b>$130</b>
        </div>
        <button class="checkout" type="button">前往結帳</button>
      </aside>
    </section>

    <footer class="bottom-bar">
      <div class="bottom-actions">
        <button type="button" aria-label="回首頁">⌂</button>
        <button type="button" aria-label="語音">🎙</button>
      </div>
      <div class="cart-pill">購物車 · 2 項 · $130</div>
    </footer>
  </main>
</body>
</html>
